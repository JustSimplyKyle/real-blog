name: Sync vendored libcosmic

on:
  schedule:
    - cron: "2-59/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-vendored-libcosmic
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Update vendored libcosmic
        id: update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C vendor/libcosmic remote set-url origin https://github.com/JustSimplyKyle/libcosmic.git
          git -C vendor/libcosmic fetch --no-tags origin cosmic-web

          current=$(git rev-parse HEAD:vendor/libcosmic)
          target=$(git -C vendor/libcosmic rev-parse origin/cosmic-web)
          if [ "$current" = "$target" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git -C vendor/libcosmic checkout --detach "$target"
          git submodule sync --recursive
          git submodule update --init --recursive
          git add vendor/libcosmic
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Install Rust
        if: steps.update.outputs.changed == 'true'
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: wasm32-unknown-unknown
          rustflags: ""

      - name: Check site WebAssembly build
        if: steps.update.outputs.changed == 'true'
        run: cargo check --target wasm32-unknown-unknown

      - name: Commit vendored update
        if: steps.update.outputs.changed == 'true'
        run: |
          git add vendor/libcosmic Cargo.lock
          git commit -m "Update vendored libcosmic"

      - name: Push main
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          git push origin HEAD:main
