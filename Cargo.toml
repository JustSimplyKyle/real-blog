[package]
name = "real-blog"
version = "0.1.0"
authors = ["kyle <kyle@nixos-desktop>"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
libcosmic = { path = "vendor/libcosmic", default-features = false, features = ["web"] }
manganis = "0.7.9"

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
console_log = "1"
gloo-net = "0.6"
web-sys = { version = "0.3", features = ["Window"] }
wasm-bindgen = "=0.2.118"
wasm-bindgen-futures = "0.4"

[patch."https://github.com/jackpot51/rust-atomicwrites"]
atomicwrites = { path = "vendor/atomicwrites" }

[features]
default = ["web"]
web = []
hot-patch = ["libcosmic/hot"]

[profile.wasm-dev]
inherits = "dev"
debug = 0
